schema_version: 1

# Gate 1 values confirmed by the 2026-07-23 live interface check.
uwb:
  topic: /nlink_linktrack_nodeframe2
  message_type: nlink_parser/LinktrackNodeframe2
  adapter: nodeframe2
  source_id: 1
  peer_id: 2
  direction: source_to_peer
  timestamp_source: receive_time
  expected_rate_hz: 50.0

mocap_a:
  topic: /vrpn_client/UWB_A/pose
  message_type: geometry_msgs/PoseStamped
  expected_frame_id: world
  quaternion_order: [x, y, z, w]
  expected_rate_hz: 53.0

mocap_b:
  topic: /vrpn_client/UWB_B/pose
  message_type: geometry_msgs/PoseStamped
  expected_frame_id: world
  quaternion_order: [x, y, z, w]
  expected_rate_hz: 53.0

status:
  topic: /uwb_bias_learning/capture_state
  message_type: std_msgs/String

time:
  require_use_sim_time_false: true
  require_nonzero_mocap_header_stamp: true
  require_same_mocap_frame: true

# Confirmed by the user for this physical A/B antenna installation. Historical
# transforms from the old localization setup do not apply to this experiment.
extrinsics:
  rigid_body_origins_at_antenna_centers: true
  rigid_body_axes_aligned_with_antennas: true
