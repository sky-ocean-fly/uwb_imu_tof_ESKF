# UWB + IMU + ToF ESKF 参数
# 注意：sigma_gyro/sigma_acc按照连续时间噪声密度理解；如果你填的是离散采样标准差，需要重新按采样频率换算。

uwb_topic: /nlink_linktrack_nodeframe2
tof_topic: /ground_distance
imu_a_topic: /imu_A/data_raw      # 无人车/平台A的IMU；按你的实际话题修改
imu_b_topic: /mynteye/imu/data_raw # 无人机/标签B的IMU；按你的实际话题修改
mocap_topic: /vrpn_client/UWB_rocket/pose

eskf_pose_topic: /eskf_estimated_pose
mocap_truth_topic: /eskf_mocap_truth_pose
frame_id: anchor_frame_A

# 推荐先运行原uwb_localization_node，让它发布一次/estimated_pose作为ESKF初值。
init_from_pose_topic: true
init_pose_topic: /estimated_pose
init_from_mocap: false            # 只建议调试时改true；正式实验不要用动捕初始化

# 现有/ground_distance的point.y已经是垂直高度，所以默认true。
# 若改为订阅原始ToF斜距point.x，再把这里改false，使用推导中的 -alpha/beta 模型。
tof_vertical_mode: true

imu_queue_size: 100
imu_sync_slop: 0.05
max_imu_dt: 0.05

sigma_gyro_A: 0.02
sigma_gyro_B: 0.02
sigma_acc_A: 0.20
sigma_acc_B: 0.20
sigma_uwb: 0.2
sigma_tof: 0.02

uwb_residual_gate: 2.0
tof_residual_gate: 1.0

# 仅当 init_from_pose_topic=false 且 init_from_mocap=false 时使用
init_p_x: 0.0
init_p_y: 0.0
init_p_z: 1.0
init_yaw_deg: 0.0
init_pitch_deg: 0.0
init_roll_deg: 0.0

init_sigma_angle: 0.30
init_sigma_velocity: 0.50
init_sigma_position: 0.50
